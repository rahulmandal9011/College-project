<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeStream - Registration</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <h2 class="text-center text-danger mb-4">
                        ❤️ LifeStream Registration
                    </h2>

                    <form id="registerForm">

                        <div class="row">

                            <!-- Personal Details -->

                            <div class="col-md-6 mb-3">
                                <label>Full Name</label>
                                <input type="text" class="form-control" id="fullName">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Email</label>
                                <input type="email" class="form-control" id="email">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Mobile Number</label>
                                <input type="text" class="form-control" id="mobile">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Blood Group</label>
                                <select class="form-select" id="bloodGroup">
                                    <option>A+</option>
                                    <option>A-</option>
                                    <option>B+</option>
                                    <option>B-</option>
                                    <option>AB+</option>
                                    <option>AB-</option>
                                    <option>O+</option>
                                    <option>O-</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Gender</label>
                                <select class="form-select" id="gender">
                                    <option>Male</option>
                                    <option>Female</option>
                                    <option>Other</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Date of Birth</label>
                                <input type="date" class="form-control" id="dob">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Weight (Kg)</label>
                                <input type="number" class="form-control" id="weight">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>City</label>
                                <input type="text" class="form-control" id="city">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>State</label>
                                <input type="text" class="form-control" id="state">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Password</label>
                                <input type="password" class="form-control" id="password">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword">
                            </div>

                            <div class="col-12 mb-3">
                                <label>Address</label>
                                <textarea class="form-control" rows="3" id="address"></textarea>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Last Blood Donation Date</label>
                                <input type="date" class="form-control" id="lastDonationDate">
                            </div>

                            <div class="col-md-6 mb-4">
                                <label>Available To Donate</label>
                                <select class="form-select" id="available">
                                    <option value="Yes">Yes</option>
                                    <option value="No">No</option>
                                </select>
                            </div>

                        </div>

                        <button class="btn btn-danger w-100" type="submit">
                            Register
                        </button>

                    </form>

                    <hr>

                    <p class="text-center">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/register.js"></script>

</body>

</html>
